name: Tests

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ">=6.9.0"
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Success message
        if: success()
        run: echo "Tout s'est bien passé !!!!!"
      - name: Error message
        if: failure()
        run: echo "Erreur !!!!!"
